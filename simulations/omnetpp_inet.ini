# Real 802.11/INET MAC-contention track.
#
# Deliberately a SEPARATE ini file from omnetpp.ini (not new [Config] blocks
# in it): a stray wildcard here can never leak into the six trusted,
# already-published configs, and vice versa.
#
# Scope (see UavNodeInetApp.ned / GroundStationNodeInetApp.ned): Phase 2
# (GS<->UAV) only, static positions, no attacker track. This measures what a
# real 802.11 CSMA/CA MAC layer costs on top of the same protocol code,
# holding everything else constant -- it is not a replacement for the
# idealised-medium baseline, it is the other side of a disclosed lower bound.

[General]
network = UavAuthNetworkInet
sim-time-limit = 60s
record-eventlog = false
ned-path = ../src;../src_inet;../simulations
repeat = 30
seed-set = ${repetition}

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 550m
**.constraintAreaMaxY = 350m
**.constraintAreaMaxZ = 0m
**.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
**.mobility.initialZ = 0m

**.arp.typename = "GlobalArp"
**.wlan[*].opMode = "g(mixed)"
**.wlan[*].mac.typename = "Ieee80211Mac"
**.wlan[*].radio.transmitter.power = 2000mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

*.numUAVs = 10

# Same perimeter coordinates as the non-INET Stadium scenario's
# omnetpp.ini (*.uav[i].xpos/ypos) -- identical physical layout, different
# network stack, so the two tracks isolate the MAC-layer delta.
*.groundStation.mobility.initialX = 275m
*.groundStation.mobility.initialY = 175m
*.groundStation.numApps = 1
*.groundStation.app[0].typename = "GroundStationNodeInetApp"
*.groundStation.app[0].numUAVs = 10

*.uav[0].mobility.initialX = 100m
*.uav[0].mobility.initialY = 50m
*.uav[1].mobility.initialX = 275m
*.uav[1].mobility.initialY = 50m
*.uav[2].mobility.initialX = 450m
*.uav[2].mobility.initialY = 50m
*.uav[3].mobility.initialX = 100m
*.uav[3].mobility.initialY = 300m
*.uav[4].mobility.initialX = 275m
*.uav[4].mobility.initialY = 300m
*.uav[5].mobility.initialX = 450m
*.uav[5].mobility.initialY = 300m
*.uav[6].mobility.initialX = 50m
*.uav[6].mobility.initialY = 120m
*.uav[7].mobility.initialX = 50m
*.uav[7].mobility.initialY = 230m
*.uav[8].mobility.initialX = 500m
*.uav[8].mobility.initialY = 120m
*.uav[9].mobility.initialX = 500m
*.uav[9].mobility.initialY = 230m

*.uav[*].numApps = 1
*.uav[*].app[0].typename = "UavNodeInetApp"
*.uav[*].app[0].numUAVs = 10
*.uav[*].app[0].authStartTime = 1s + index * 0.3s
*.uav[*].app[0].peerAuthStartTime = 20s
*.uav[*].app[0].fullMesh = true
*.uav[*].app[0].suite = "sha3"
*.groundStation.app[0].suite = "sha3"

output-scalar-file = results/${configname}-${runnumber}.sca
output-vector-file = results/${configname}-${runnumber}.vec

# ---------------------------------------------------------------------------
# Detection window for Phase 2. The real 802.11 stack adds backoff and
# retransmission, so a generous limit is needed for all ten handshakes to
# complete; the handshakes themselves finish in ~12 ms of simulated time.
# ---------------------------------------------------------------------------
sim-time-limit = 120s

[Config Inet80211SHA3]
description = "10 UAVs, real 802.11 CSMA/CA (INET), Phase 2 + Phase 3, static positions"

# ===========================================================================
# Mobility on the real MAC. Motion is meaningful here in a way it is not on
# the idealised medium: 802.11 received power, SNIR and therefore CSMA/CA
# behaviour all depend on live distance, so a moving UAV genuinely changes the
# channel. It does NOT change compute, which is the same protocol code -- the
# point of the split.
#
# Two motion models, both INET's own, so the trajectory generator is the
# standard one rather than something this project wrote:
#   LinearMobility       constant heading, reflects off the constraint area
#   RandomWaypointMobility  new random waypoint drawn periodically
# ===========================================================================
[Config InetMobilityLinearSHA3]
description = "10 UAVs, real 802.11 CSMA/CA, Phase 2 + Phase 3, UAVs moving linearly"
*.uav[*].mobility.typename = "LinearMobility"
*.uav[*].mobility.speed = 8mps
*.uav[*].mobility.angle = 0deg

[Config InetMobilityRandomWalkSHA3]
description = "10 UAVs, real 802.11 CSMA/CA, Phase 2 + Phase 3, random-waypoint motion"
*.uav[*].mobility.typename = "RandomWaypointMobility"
*.uav[*].mobility.speed = 8mps
