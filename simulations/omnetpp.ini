[General]
network = UavAuthNetwork
sim-time-limit = 300s

cmdenv-express-mode = true
cmdenv-status-frequency = 10s
record-eventlog = false

ned-path = ../src;../simulations

# ---------------------------------------------------------------------------
# Statistical rigour.
#
# Thirty independent repetitions per configuration, each with its own seed set,
# so every reported mean can carry a confidence interval. The unit of
# replication is the run, not the CSV row: rows inside one run share a PRNG
# stream and a scheduling epoch, so pooling them would understate the interval.
# ---------------------------------------------------------------------------
repeat = 30
seed-set = ${repetition}

# ---------------------------------------------------------------------------
# Scenario: 10 UAVs around a 500 x 300 m field, ground station at the centre.
# ---------------------------------------------------------------------------
*.numUAVs = 10
*.suite = "sha3"
*.feProfile = "bch255-131-18"
*.pufModel = "ideal"
*.pufNoiseBer = 0.03
*.assumedMinEntropyRate = 0.95

# Perimeter positions. Real NED parameters, not display-string text, so the
# delay model reads coordinates rather than parsing presentation markup.
*.uav[0].xpos = 100m
*.uav[0].ypos = 50m
*.uav[1].xpos = 275m
*.uav[1].ypos = 50m
*.uav[2].xpos = 450m
*.uav[2].ypos = 50m
*.uav[3].xpos = 100m
*.uav[3].ypos = 300m
*.uav[4].xpos = 275m
*.uav[4].ypos = 300m
*.uav[5].xpos = 450m
*.uav[5].ypos = 300m
*.uav[6].xpos = 50m
*.uav[6].ypos = 120m
*.uav[7].xpos = 50m
*.uav[7].ypos = 230m
*.uav[8].xpos = 500m
*.uav[8].ypos = 120m
*.uav[9].xpos = 500m
*.uav[9].ypos = 230m
# Any UAV beyond index 9 (the swarm configurations) gets a default ring position.
*.uav[*].xpos = 275m
*.uav[*].ypos = 175m

# Staggered starts so the handshakes do not all land on the same instant.
*.uav[*].authStartTime = 1s + index * 0.5s
*.uav[*].peerAuthStartTime = 30s
*.uav[*].fullMesh = true

# Link model.
*.medium.linkBitrateBps = 6e6
*.medium.propagationSpeedMps = 299792458
*.medium.processingDelayMs = 0.1
*.medium.jitterStddevMs = 0.02
*.medium.enableJitter = true
# NOTE: tapEnabled/attackMode are deliberately NOT set here. An identically
# specific pattern in [General] wins over the same pattern in a [Config] section,
# so setting them here would silently disable every attack configuration. The NED
# defaults (tapEnabled=false, attackMode="none") already give an unattacked run.

output-vector-file = results/${configname}-${runnumber}.vec
output-scalar-file = results/${configname}-${runnumber}.sca

# ===========================================================================
# Primary configurations
# ===========================================================================

[Config StadiumSHA3]
description = "10 UAVs, software-efficient suite (SHA3/HMAC/HKDF/ChaCha20-Poly1305)"
*.suite = "sha3"

[Config StadiumSPONGENT]
description = "10 UAVs, constrained-hardware suite (SPONGENT-160/keyed sponge/Ascon-128a)"
*.suite = "spongent"

[Config Baseline5UAV]
description = "5 UAVs, for scaling comparison"
*.numUAVs = 5

[Config Swarm20]
description = "20 UAVs: Phase 3 grows as N(N-1)/2 = 190 pairs"
*.numUAVs = 20
*.uav[*].authStartTime = 1s + index * 0.3s
*.uav[*].peerAuthStartTime = 40s

# ===========================================================================
# PUF noise sweep: reliability of the fuzzy extractor.
#
# The default profile's failure rate is measurable (~1.2e-3 at 3% BER), which is
# the point of choosing it as the default: a 1e-15 rate cannot be observed in any
# feasible Monte Carlo, so a sweep against it would be vacuous.
# ===========================================================================
[Config NoiseSweep]
description = "PUF bit-error rate sweep, all three fuzzy-extractor profiles"
*.numUAVs = 10
*.pufModel = "arbiter"
*.pufNoiseBer = ${ber = 0.0, 0.01, 0.02, 0.03, 0.05, 0.07, 0.10}
*.feProfile = ${profile = "bch255-131-18", "bch255-91-25", "rep3-bch255-131-18"}
repeat = 3

[Config HighNoise]
description = "5 percent PUF bit-error rate (this now actually takes effect)"
*.pufNoiseBer = 0.05
*.pufModel = "arbiter"

[Config ArbiterPuf]
description = "Additive-delay arbiter PUF instead of the idealised PRF model"
*.pufModel = "arbiter"

# ===========================================================================
# Attack configurations. Each is expected to show a zero success rate; the
# legacy control arm exists so that "every attack failed" is falsifiable.
# ===========================================================================
[Config AtkEavesdrop]
description = "Passive wiretap: attacker sees every message"
*.medium.tapEnabled = true
*.medium.attackMode = "eavesdrop"
repeat = 5

[Config AtkCredSniff]
description = "Passive credential sniffing against the AEAD-wrapped M4"
*.medium.tapEnabled = true
*.medium.attackMode = "credsniff"
repeat = 5

[Config AtkTamper]
description = "Active tampering: fields modified in flight"
*.medium.tapEnabled = true
*.medium.attackMode = "tamper"
repeat = 5

# ===========================================================================
# Attack evaluation.
#
# Each attack states the outcome it expects, so the run itself checks the
# security claim instead of prose asserting it. AtkLegacy* are the control arm:
# the SAME attacker code must succeed there, because otherwise "every attack
# failed" could equally mean the attacker is broken.
# ===========================================================================
[Config AtkGsImpersonate]
description = "Forged M2 (chosen challenge): must draw no reply -- no read-out oracle"
*.enableAttacker = true
*.attackMode = "gsimpersonate"
*.medium.tapEnabled = true
*.medium.attackMode = "impersonate"
*.attacker[0].expectSuccess = false
*.uav[*].protocolVariant = "hardened"
repeat = 5

[Config AtkLegacyGsImpersonate]
description = "CONTROL ARM: same attack against the audited protocol -- must succeed"
*.enableAttacker = true
*.attackMode = "gsimpersonate"
*.medium.tapEnabled = true
*.medium.attackMode = "impersonate"
*.attacker[0].expectSuccess = true
*.uav[*].protocolVariant = "legacy"
repeat = 5

[Config AtkReplayM1]
description = "Verbatim M1 replay inside the freshness window: nonce cache must refuse it"
*.enableAttacker = true
*.attackMode = "replay"
*.medium.tapEnabled = true
*.medium.attackMode = "eavesdrop"
*.attacker[0].expectSuccess = false
repeat = 5

[Config AtkCredentialSniff]
description = "Passive read of M4: the credential package must not be plaintext"
*.enableAttacker = true
*.attackMode = "credsniff"
*.medium.tapEnabled = true
*.medium.attackMode = "eavesdrop"
*.attacker[0].expectSuccess = false
repeat = 5
