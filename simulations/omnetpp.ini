[General]
network = UAVAuthNetwork
sim-time-limit = 120s

cmdenv-express-mode = false
record-eventlog = false

ned-path = ../src;../simulations

# Stadium Air Protection Scenario
# Area: 500m x 300m
# 10 UAVs positioned around perimeter
*.numUAVs = 10
*.hashMode = "sha3"

# Ground station parameters (located at stadium center: 275m, 175m in display coords)
*.groundStation.numCRPsPerUAV = 12
*.groundStation.pufSeedBase = 1000
*.groundStation.defaultPUFNoise = 0.03
*.groundStation.responseDistanceThreshold = 24
*.groundStation.timestampWindowMs = 5000
*.groundStation.linkBitrateBps = 6Mbps
*.groundStation.propagationSpeedMps = 299792458mps
*.groundStation.processingDelayMean = 0.1ms
*.groundStation.queueJitterStddev = 0.02ms
*.groundStation.enableRandomJitter = true
*.groundStation.hashMode = ${hashMode="sha3"}

# UAV positions for stadium coverage (10 UAVs in perimeter pattern)
# Long side north (y=50): UAVs 0, 1, 2
*.uav[0].display-string = "p=100,50"
*.uav[1].display-string = "p=275,50"
*.uav[2].display-string = "p=450,50"

# Long side south (y=300): UAVs 3, 4, 5
*.uav[3].display-string = "p=100,300"
*.uav[4].display-string = "p=275,300"
*.uav[5].display-string = "p=450,300"

# End zone west (x=50): UAVs 6, 7
*.uav[6].display-string = "p=50,120"
*.uav[7].display-string = "p=50,230"

# End zone east (x=500): UAVs 8, 9
*.uav[8].display-string = "p=500,120"
*.uav[9].display-string = "p=500,230"

# UAV parameters
*.uav[*].uavId = index
*.uav[*].pufSeed = 1000 + index
*.uav[*].tempId = "UAV_" + string(index)
*.uav[*].pufNoiseLevel = 0.03
*.uav[*].authStartTime = 1s + index * 0.5s
*.uav[*].peerAuthStartTime = 10s + index * 0.5s
*.uav[*].linkBitrateBps = 6Mbps
*.uav[*].propagationSpeedMps = 299792458mps
*.uav[*].processingDelayMean = 0.1ms
*.uav[*].queueJitterStddev = 0.02ms
*.uav[*].enableRandomJitter = true
*.uav[*].peerTargetId = (index + 1) % numUAVs
*.uav[*].hashMode = ${hashMode}

# Metrics
**.authLatency.result-recording-modes = all
**.peerAuthLatency.result-recording-modes = all
**.commOverhead.result-recording-modes = all
**.authSuccess.result-recording-modes = all

# Output files
output-vector-file = results/UAVAuth-${configname}-${runnumber}.vec
output-scalar-file = results/UAVAuth-${configname}-${runnumber}.sca

[Config StadiumSHA3]
description = "Stadium scenario with SHA3-256 hash (10 UAVs)"
*.hashMode = "sha3"

[Config StadiumSPONGENT]
description = "Stadium scenario with SPONGENT-160 hash (10 UAVs)"
*.hashMode = "spongent"

[Config StadiumBoth]
description = "Stadium scenario comparing both hash modes"
*.hashMode = ${hashMode="sha3", "spongent"}

[Config Baseline5UAV]
description = "5 UAV baseline for comparison"
*.numUAVs = 5
*.uav[*].authStartTime = 1s + index * 0.5s
*.uav[*].peerAuthStartTime = 10s + index * 0.5s
*.uav[*].peerTargetId = (index + 1) % 5

[Config Swarm20]
description = "20 UAV swarm for scalability test"
*.numUAVs = 20
*.uav[*].authStartTime = 1s + index * 0.3s
*.uav[*].peerAuthStartTime = 15s + index * 0.3s
*.uav[*].peerTargetId = (index + 1) % 20

[Config HighNoise]
extends = StadiumSHA3
description = "5 percent PUF noise"
*.uav[*].pufNoiseLevel = 0.05
*.groundStation.defaultPUFNoise = 0.05
